# CI gates for SIH26034. The five statutory/quality gates are specified in plan §15.4.
#
# Gates that cannot run yet are present as jobs that emit a loud NOT IMPLEMENTED
# notice and pass. They are not omitted and they are not silently green: a gate that
# looks like it ran when it did not is exactly the failure mode P9 forbids. Each names
# the task that implements it.
#
# Note: this repo has no remote yet, so nothing here has executed. It is a stub whose
# job wiring is checked by review, not by a run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.10'

jobs:
  # ---------------------------------------------------------------- implemented

  typescript:
    name: TypeScript — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python — lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # ------------------------------------------------------------ gates: plan §15.4

  rulepack-schema:
    name: 'Gate: rule-pack schema (T-1.2)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate every pack against rulepack/schema/rulepack.schema.json
        run: |
          if [ ! -f rulepack/schema/rulepack.schema.json ]; then
            echo "::error title=Schema missing::rulepack/schema/rulepack.schema.json was deleted — it is the contract this gate exists to enforce"
            exit 1
          fi
          pip install -r requirements-dev.txt
          python rulepack/validate.py

  conformance:
    name: 'Gate: evaluator conformance (T-1.9)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TypeScript and Python evaluators must produce identical verdicts
        run: |
          if [ ! -f conformance/run_py.py ] || [ ! -f conformance/run_ts.ts ]; then
            echo "::notice title=Gate not implemented::conformance gate is a no-op until T-1.9 adds conformance/run_py.py and conformance/run_ts.ts"
            exit 0
          fi
          echo "::error title=Gate wiring missing::runners exist but are not invoked — implement this step with T-1.9"
          exit 1

  unreviewed-thresholds:
    name: 'Gate: PENDING_LEGAL_REVIEW emits advisories only (T-1.9)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No rule marked PENDING_LEGAL_REVIEW may produce a violation
        run: |
          if [ ! -f rulepack/lmpc-2011.json ]; then
            echo "::notice title=Gate not implemented::advisory-only gate is a no-op until T-1.3 creates rulepack/lmpc-2011.json and T-1.9 adds the enforcing test"
            exit 0
          fi
          echo "::error title=Gate wiring missing::rule pack exists but the advisory-only test is not wired — it must be a test, not a convention"
          exit 1

  accuracy-regression:
    name: 'Gate: accuracy regression (T-2.9)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Precision may not fall below baseline; recall may not fall >2 points
        run: |
          if [ ! -f eval/run.py ]; then
            echo "::notice title=Gate not implemented::accuracy gate is a no-op until T-2.9 adds eval/run.py and a committed baseline in eval/baselines/"
            exit 0
          fi
          echo "::error title=Gate wiring missing::eval/run.py exists but no baseline diff is wired — implement this step with T-2.9"
          exit 1

  latency-regression:
    name: 'Gate: latency regression (T-6.2)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provisional-path benchmark may not regress more than 15%
        run: |
          echo "::notice title=Gate not implemented::latency gate is a no-op until T-6.2."
          echo "::notice title=Constraint::Latency numbers come from the physical Android device only. CI can compare a device-produced snapshot committed to eval/baselines/, never measure it here."
          exit 0
